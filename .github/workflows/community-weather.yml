name: Community Weather Daily

on:
  schedule:
    # 06:20 UTC = evening NZ / morning UK. Keeps a stable daily rhythm without colliding with the main briefing.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      post:
        description: 'Publish the generated social copy via Postiz'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: community-weather-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate daily community weather report
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          POSTIZ_X_INTEGRATION_ID: ${{ secrets.POSTIZ_X_INTEGRATION_ID }}
          ALBIS_REPORT_TIMEZONE: Pacific/Auckland
        run: |
          set -euo pipefail
          SHOULD_POST="false"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "${POSTIZ_API_KEY:-}" ]; then
            SHOULD_POST="true"
          fi
          if [ "${{ github.event.inputs.post || 'false' }}" = "true" ] && [ -n "${POSTIZ_API_KEY:-}" ]; then
            SHOULD_POST="true"
          fi

          if [ "$SHOULD_POST" = "true" ]; then
            npx tsx scripts/run-community-weather-daily.ts --limit=100 --media-per-city=3 --media-scope=active --post
          else
            echo "Generating report without posting. Scheduled runs publish only when POSTIZ_API_KEY is configured."
            npx tsx scripts/run-community-weather-daily.ts --limit=100 --media-per-city=3 --media-scope=active
          fi

      - name: Commit generated weather data
        run: |
          set -euo pipefail
          git config user.name "albis-community-weather-bot"
          git config user.email "actions@github.com"
          git add public/community-weather data/community-weather reports/community-weather
          if git diff --cached --quiet; then
            echo "No generated weather changes to commit"
          else
            git commit -m "Update community weather report"
            git push
          fi
